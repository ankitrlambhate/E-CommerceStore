server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using variables below means nginx starts even if a
    # backend container is not up yet (names are resolved per request).
    resolver 127.0.0.11 valid=10s;

    # Simple liveness message for the frontend itself
    location = /healthz {
        default_type text/plain;
        return 200 "Frontend is Live\n";
    }

    # Reverse proxy to the backend containers: /svc/<name>/x -> http://<name>-service:<port>/x
    location ~ ^/svc/user/ {
        set $upstream http://user-service:3001;
        rewrite ^/svc/user(/.*)$ $1 break;
        proxy_pass $upstream;
    }
    location ~ ^/svc/product/ {
        set $upstream http://product-service:3002;
        rewrite ^/svc/product(/.*)$ $1 break;
        proxy_pass $upstream;
    }
    location ~ ^/svc/cart/ {
        set $upstream http://cart-service:3003;
        rewrite ^/svc/cart(/.*)$ $1 break;
        proxy_pass $upstream;
    }
    location ~ ^/svc/order/ {
        set $upstream http://order-service:3004;
        rewrite ^/svc/order(/.*)$ $1 break;
        proxy_pass $upstream;
    }

    # React Router: fall back to index.html for client-side routes
    location / {
        try_files $uri /index.html;
    }
}
